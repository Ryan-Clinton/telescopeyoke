# A patrol of the whole Andromeda Galaxy for novae, panel by panel
# (docs/discovery.md). The panels are mosaic.py's, planned when first used;
# each night they are taken in order of priority (novae reported in the
# panel x the share it should catch x days since it was watched, over the
# minutes it costs) for as long as the night allows.
# ./patrol.py m31-panels --plan, then ./patrol.py m31-panels

mosaic = "M31"
grid = "4x2"

# Minutes on each panel: enough frames that the search still has its
# eight after a camera stall, a passing cloud and the quality pass. Five
# (from 17 October) was too few: on 4 November 2026 panels P3, P5 and P6
# came out with 6 or 7 stacked frames and were never searched. Eight is
# about 24 frames; a pass of eight panels is about 75 minutes.
minutes = 8

exposure = 16
gain = 1500

# No dither within a short visit: each panel's GoTo lands a little
# differently every night, which moves the camera's pattern between nights.

# A nova lasts the night: a candidate in one half of the night only is set
# aside (vet.py says so either way; this is where it is decided).
both_halves = true

# What each visit must get (docs/observing-plan-spec.md, decisions approved 4 Nov 2026).
# searchable_frames: stacked frames the search needs (vet.HALVES_FROM).
# worth_depth: G a stack must reach to count as watched, provisional: about 16% of
# M31 novae peak brighter (patrol.completeness); to be set from measured completeness.
[goals]
searchable_frames = 8
worth_depth = 16.5
desired_frames = 24
# A depth-based stretch (decision 1, 4 Nov 2026), provisional as worth_depth:
# the nova peak the patrol's completeness is centred on (patrol.NOVA_PEAK).
stretch_depth = 17.5
