name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest -q
      - run: ./tonight.py --demo --top 5
      - run: ./mount.py --demo goto M27
      - run: ./ty capabilities --json
      - run: ./mount.py --demo goto M27 --dry-run --json
