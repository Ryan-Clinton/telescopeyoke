name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest -q
      - run: ./tonight.py --demo --top 5
      # The zenith is always reachable; a named object may have set when this runs.
      - run: ./mount.py --demo zenith
      - run: ./ty capabilities --json
      - run: ./mount.py --demo zenith --dry-run --json

  # No hardware here either: this shows the scripts start and the tests pass
  # on Windows, not that a camera or mount has been used there.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      # The installer is not run here (it would open the demo's window); this
      # only shows that PowerShell can read it.
      - run: powershell -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null"
      - run: python -m pytest -q
      - run: python tonight.py --demo --top 5
      - run: python mount.py --demo zenith
      - run: .\ty.cmd capabilities --json
      - run: python mount.py --demo zenith --dry-run --json
