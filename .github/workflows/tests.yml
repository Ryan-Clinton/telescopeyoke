name: tests

# Once a day, and by hand (the Actions tab, "Run workflow"); never on a push.
# The tests that touch a change run on the laptop before it is pushed; this
# only catches what those cannot, chiefly Windows, within a day.
on:
  schedule:
    - cron: "0 9 * * *"     # 09:00 UTC, after the night
  workflow_dispatch:

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ".[test]" ruff
      # Mistakes, not style: names never defined or never used, code that cannot run.
      - run: ruff check .
      - run: pytest -q
      - run: ./tonight.py --demo --top 5
      # The zenith is always reachable; a named object may have set when this runs.
      - run: ./mount.py --demo zenith
      - run: ./ty capabilities --json
      - run: ./mount.py --demo zenith --dry-run --json

  # No hardware here either: this shows the scripts start and the tests pass
  # on Windows, not that a camera or mount has been used there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]"
      # The installer is not run here (it would open the demo's window); this
      # only shows that PowerShell can read it.
      - run: powershell -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null"
      - run: python -m pytest -q
      - run: python tonight.py --demo --top 5
      - run: python mount.py --demo zenith
      - run: .\ty.cmd capabilities --json
      - run: python mount.py --demo zenith --dry-run --json
