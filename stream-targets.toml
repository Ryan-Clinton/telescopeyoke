# What the live stream says about each object and programme (docs/stream-look.md).
# Plain words for someone who knows no astronomy; never catalogue prose. `words` is one
# short sentence, always on screen; anything more goes in `captions`, shown now and then.
# Every figure here is checked against a published source before it goes in:
# an object with no entry shows its name and its catalogue type only.

[targets.M31]
common = "Andromeda Galaxy"
words = "The nearest large galaxy to the Milky Way."
distance = "~2.5 million light years"
magnitude = 3.4
captions = [
    "The light reaching the camera from Andromeda left it about 2.5 million years ago.",
    "Andromeda holds about a trillion stars; every faint smudge in its disc is millions of them.",
]

[targets.M33]
common = "Triangulum Galaxy"
words = "A nearby spiral galaxy, smaller than ours, where the telescope patrols for exploding stars."
distance = "~2.7 million light years"
magnitude = 5.7
captions = [
    "Triangulum is one of the most distant things the human eye can see without a telescope.",
]

[targets.WASP-12]
words = "A star with a giant planet so close that it circles in just over a day."
distance = "~1,400 light years"
magnitude = 11.6
captions = [
    "WASP-12 b is so close to its star that the star is slowly pulling it apart.",
    "Each transit's timing is compared with earlier ones: the planet's orbit is shrinking.",
]

# Captions for each kind of run, shown in turn with the object's own.
[programmes]
patrol = [
    "Every star in this picture is being compared with an earlier night.",
    "A nova would appear here as a point of light that wasn't in the reference image.",
]
transit = [
    "When the planet crosses its star it blocks a little of the light: the dip in the curve.",
    "The timing of the dip is measured to the minute and shared with other observers.",
]
picture = [
    "Every exposure is added to the stack; the noise falls as they add up.",
]
