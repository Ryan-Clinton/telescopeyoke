# What the live stream says about each object, programme and the telescope
# (docs/stream-look.md; shown by streamstory.py).
# Plain words for someone who knows no astronomy; never catalogue prose. `words` is one
# short sentence, always on screen. The rest is shown a card at a time:
#   facts   - SCIENCE cards: what the object is
#   why     - SCIENCE cards: why it is worth looking at
#   notice  - LOOK CLOSELY lines across the picture: what to look for in it
# Every figure here is checked against a published source before it goes in.
# An object with no entry shows its name and its catalogue type only. Figures that
# change (exposures, depth, star size) are never written here: streamstory.py
# makes them from the night's own measurements.

[targets.M31]
common = "Andromeda Galaxy"
words = "The nearest large galaxy to the Milky Way."
distance = "~2.5 million light years"
magnitude = 3.4
facts = [
    "The light reaching the camera from Andromeda left it about 2.5 million years ago.",
    "Andromeda holds roughly a trillion stars: every faint smudge in its disc is millions of them.",
    "Andromeda and the Milky Way are moving towards each other at about 110 km a second.",
]
why = [
    "Dozens of novae are found in Andromeda every year: it is the best place in the sky to catch one.",
]
notice = [
    "Away from the core, the faint glow is the disc: billions of stars too far apart to see one by one.",
    "Almost every sharp star in this picture is in our own galaxy, in front of Andromeda.",
]

[targets.M33]
common = "Triangulum Galaxy"
words = "A nearby spiral galaxy, smaller than ours."
distance = "~2.7 million light years"
magnitude = 5.7
facts = [
    "Triangulum is the third largest galaxy in our Local Group, after Andromeda and the Milky Way.",
    "Triangulum holds about 40 billion stars, roughly a tenth as many as the Milky Way.",
]
why = [
    "Triangulum is one of the most distant things the eye can see without a telescope, under a dark sky.",
]
notice = [
    "Its arms are loose and patchy: the brighter knots are clouds where new stars are forming.",
]

[targets.WASP-12]
words = "A star with a giant planet so close that it circles in just over a day."
distance = "~1,400 light years"
magnitude = 11.6
facts = [
    "WASP-12 b was found in 2008 by SuperWASP, a set of cameras watching for stars that dim.",
    "WASP-12 b is almost twice as wide as Jupiter, puffed up by the heat of its star.",
    "WASP-12 b is one of the hottest planets known: about 2,300 °C on the side facing its star.",
]
why = [
    "WASP-12 b's orbit is shrinking: its transits come a little earlier each year, so each one timed matters.",
    "The star is slowly pulling the planet apart: it may not survive more than a few million years.",
]
notice = [
    "WASP-12 is one faint star among hundreds here: the light curve, not the picture, shows the planet.",
]

[programmes.patrol]
title = "Nova patrol"
explainers = [
    "A nova is a white dwarf star pulling gas from a companion until the gas ignites: for a few days it shines thousands of times brighter.",
    "A nova does not destroy its star: some flare up again decades later.",
]
method = [
    "Tonight's picture is lined up with an earlier one of the same field and subtracted from it: whatever is left over has changed.",
    "Anything left over is checked against catalogues of known variable stars and asteroids before it counts.",
    "Finding nothing is useful too: each clear search rules out a new star brighter than its measured limit.",
]

[programmes.transit]
title = "Transit"
explainers = [
    "When a planet crosses in front of its star, the star dims a little: that dip is a transit.",
    "Most of the planets known around other stars were found by the dips they make in their stars' light.",
]
method = [
    "The star's brightness is measured against hundreds of other stars in the same picture, so haze dims them all alike.",
    "The out-of-transit time before and after the dip is as important as the dip: it shows the star's steady light.",
    "Timings like this can be shared with ExoClock, which keeps planets' timetables for ESA's Ariel space telescope.",
]

[programmes.picture]
title = "Building a picture"
explainers = [
    "Every exposure is added to the stack; the noise falls as they add up.",
]
method = []

# How the telescope works: HOW IT WORKS and THE TELESCOPE cards, for any programme.
[stories]
stacking = [
    "One exposure is noisy. Stacking many lines them up and averages them: a hundred exposures are about ten times cleaner than one.",
    "Frames spoiled by cloud, wind or a passing satellite are set aside before stacking, not added.",
]
plate_solving = [
    "Before imaging, the software works out exactly where the telescope points by matching the stars in a picture to a star catalogue.",
]
# Also the cards shown while the telescope focuses (stream.py's focus segment).
# From docs/how-it-all-works.md ("Focus") and docs/focuser.md.
focus = [
    "A small motor on the focuser turns it in steps far finer than a hand can, and the software judges focus by the stars' size.",
    "HFR, the half-flux radius, is the radius of the circle holding half a star's light. Smaller is sharper: about 2 pixels is good focus here.",
    "The air shimmers, so any one star swells and shrinks from moment to moment. Measuring many stars and taking the middle value is far steadier.",
    "Near focus one reading can jump by half again from the air alone, so no single reading can say which way focus lies.",
    "In a reflector far out of focus, a star is a doughnut: its dark middle is the shadow of the small second mirror in the tube.",
    "The focuser's gears have a little slack, so every position is reached moving the same way, inward: the slack never enters a reading.",
    "Star size against focuser position makes a V-shaped curve. A curve fitted through every point finds its bottom more surely than any one reading.",
    "Focus drifts through a night: as the air cools the telescope's tube shrinks a little, so focus is checked again between targets.",
    "Focus is only changed when it needs it: a quick check first, and if the stars are as small as usual it is left alone.",
]
# The cards shown while the mount is polar aligned (stream.py's polar segment).
# From docs/how-it-all-works.md ("Polar alignment") and docs/calibration.md.
polar = [
    "The sky turns about one point near Polaris, the celestial pole. The mount's polar axis has to point there for it to follow the stars.",
    "Polaris is not exactly at the pole: it is about two thirds of a degree away, so aiming at Polaris alone is not quite enough.",
    "An equatorial mount follows a star by turning one axis. Aimed at the pole, that turn keeps the star still; aimed off it, the star creeps away.",
    "Three pictures with only the polar axis turned between them land on a circle. The circle's centre is where the axis really points.",
    "That centre against the true pole gives the error as two numbers, one for each pair of bolts: azimuth, round, and altitude, up and down.",
    "With the axis off the pole the stars creep slowly across the picture, mostly in declination: the drift that polar alignment removes.",
    "The azimuth bolts turn the mount round on the tripod; the altitude bolts tilt it up and down. More than 2° out, the whole tripod is turned.",
    "A level tripod is not essential: once the axis points at the pole the mount tracks the same however the tripod leans. Level only saves rounds.",
    "Small errors are left alone: one is worth a turn of the bolts only if the drift it causes would show in a single picture.",
]
discovery = [
    "Fake stars of known brightness are hidden in each picture and searched for: how many are found measures how faint the search can reach.",
    "During its testing, this software found a known nova again in archived survey pictures before it was trusted with new ones.",
]
telescope = [
    "The telescope is a 150 mm reflector: a mirror gathers the light, on a mount that follows the stars across the sky.",
    "The camera sees about 1° by 0.7° of sky at once: two full Moons side by side.",
    "The camera's sensor has 20 million pixels, each 2.4 thousandths of a millimetre across.",
]
