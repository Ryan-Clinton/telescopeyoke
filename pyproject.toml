[project]
name = "telescopeyoke"
version = "0.2.1"
description = "Makes an ordinary Sky-Watcher SynScan telescope smarter by measuring and correcting the things that normally have to be set up perfectly by hand: self-centring GoTos, focusing by ear, a skyline from a phone panorama, polar alignment and stacking. Ubuntu, with a Windows port."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# The oldest versions known to work. install.sh uses the distribution's
# packages instead; CI and "pip install ." use these.
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.1",
    "requests>=2.31",
    "pyserial>=3.5",
    # Every kept record is checked against its schema before it is written.
    "jsonschema>=4.10",
    # Satellites' orbits, for streak.py only.
    "sgp4>=2.20",
    # Windows has no time zone database of its own.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# archive.py tess only: TESS's light curves from MAST.
archive = ["astroquery>=0.4.6"]
# sxwheel.py only: the Starlight Xpress filter wheel, a USB HID device.
wheel = ["hidapi>=0.14"]

[project.urls]
Homepage = "https://ryan-clinton.github.io/telescopeyoke/"
Repository = "https://github.com/Ryan-Clinton/telescopeyoke"

# The scripts are run from a checkout, not installed as a package.
[tool.setuptools]
py-modules = []

# Mistakes, not style. E9 is code that cannot run, F is
# pyflakes (names never defined or never used, a name hiding another).
[tool.ruff]
line-length = 120
extend-exclude = ["demo", "rigs", "frames"]

[tool.ruff.lint]
select = ["E9", "F"]

