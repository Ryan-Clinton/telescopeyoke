# Copy this file to config.toml and fill in your own site.
# config.toml is not committed, since it gives away where you live.

[site]
name = "My back garden"
# Decimal degrees; west longitudes are negative. A postcode's centre is
# accurate enough.
latitude = 51.4779
longitude = -0.0015
elevation_m = 45
timezone = "Europe/London"
# Zenith sky brightness in mag/arcsec². Leave unset to look it up in the
# light pollution atlas; set it if you measure the real value with a meter.
# sqm = 20.55

[horizon]
# Lowest altitude (degrees) worth pointing at in any direction.
min_altitude = 20
# Directions blocked by houses, trees etc. Azimuth runs 0 = north, 90 = east,
# 180 = south, 270 = west. Example: the house blocks the south up to 40°:
#   blocked = [ { from = 150, to = 210, altitude = 40 } ]
blocked = []
# A skyline measured from where the telescope stands (./panorama.py from a
# phone panorama, or ./horizon.py --trace) is used as well, raised by this
# many degrees: one branch is enough to spoil a frame.
margin = 2
# false: leave the measured skyline out and go by `blocked` alone.
use_survey = true

[scope]
aperture_mm = 150
focal_length_mm = 750

[camera]
# INDI driver for the camera, and the sensor's details. The plate solver
# works out the field of view from these and the focal length above.
driver = "indi_altair_ccd"
bit_depth = 12
pixel_size_um = 2.4
width = 5440
height = 3648
# A name for how the camera currently sits on the telescope. Flat frames are
# filed under it, because a flat only suits the arrangement it was taken
# with: change the name (and take new flats) whenever you rotate the camera,
# take it off and put it back, or change anything in the light path.
setup = "default"
# How frames are fetched from the camera. "indi" is the INDI driver above
# and the default on Linux. "altair" is Altair's own library, with its files
# in vendor/altair/; it is the default on Windows, where INDI does not run.
# backend = "altair"
# With the "altair" backend only:
# serial = "..."          which camera to use when more than one is plugged in
# readout_speed = 1       the camera's readout speed level; unset leaves it as it is
# power_cycle_on_jam = true   when a frame is lost twice, cut the camera's power at its
#                         powered hub's port and give it back before trying again
#                         (uhubctl; a hub that switches each port's power; Linux only)
# train = "..."          which [trains.NAME] it is on now, when it is in more than one

# More than one camera (docs/mono-upgrade.md). The [camera] table above is
# the "183c" profile; another camera gets a [cameras.NAME] table of its own
# with the same settings, and anything it leaves out is the 183C's sensor
# (backend and driver it takes from [camera]). The camera plugged in is
# matched to a profile when it opens, by `model` (part of the name Altair's
# library gives it; the profile's own name when left out) or `serial`; a
# camera that matches none is refused. Each camera keeps its own darks,
# flats, focus readings and references under its name in the data folder
# (./cameras.py).
# [cameras.183m]
# model = "183M"
# mono = true
# cooled = true
# readout_speed = 0
# The cooler's target in °C, one value for the season so one set of darks
# serves, never below -5 (no gain below it on this sensor). The cooler goes
# down to it slowly, 1 °C a minute from the sensor's own temperature (never
# one jump: the window can frost); runs wait until the sensor is within 1 °C
# of it, and warm it 3 °C a
# minute at their end before the cooler goes off. Only a camera with a
# cooler acts on it.
# tec_target = 0
#
# A train is one light path: its camera, the corrector's factor (0.9 for the
# Sky-Watcher coma corrector: 750 mm becomes 675 mm), whether the filter
# wheel is in it, and the setup name its flats are filed under. A camera in
# no train is straight on the telescope, as always.
# [trains.183m-cc]
# camera = "183m"
# corrector = 0.9
# filterwheel = true
# setup = "183m-cc"

[imaging]
# The camera profile to use when both cameras are plugged in (or ./ty --camera
# NAME for one command). Blank: the one plugged in.
camera = ""
# A mono camera's frames are stacked and searched in 2x2 blocks (2), as the
# colour camera's always are, or at full resolution (1). The raw frames kept
# are the full sensor either way.
processing_scale = 2

[mount]
# The distance from one tripod foot to the next, in centimetres. With it, the
# polar alignment says how far each foot moves when the whole tripod has to
# be turned. Leave it out and it gives the turn in degrees only.
# feet_apart_cm = 87
# Better still, what was measured while aligning: how far a foot moved for
# each degree the tripod turned, and what one mark on the latitude scale is
# worth. With the second, raising or lowering the axis is said in marks.
# tripod_cm_per_degree = 2.3
# latitude_degrees_per_mark = 1.9
# Part of the name of the USB adapter on the handset's serial lead, as it
# appears under /dev/serial/by-id/, or on Windows against the COM port in
# Device Manager. A handset plugged in by its own USB socket is "Prolific".
serial_match = "FTDI"
# How the mount is reached. "handset": a serial lead to the SynScan handset,
# which is the tested way. With no handset plugged in: "wifi" for the SynScan
# Wi-Fi adapter, or "eqdir" for an EQDIR lead (found by serial_match). On
# these two the mount must be told where home is (./mount.py sethome) and,
# once, which way its Dec motor turns (./mount.py directions).
# link = "wifi"
# The Wi-Fi adapter's address. Leave it out to find the adapter by asking the
# network; it is 192.168.4.1 on the network the adapter makes itself.
# address = "192.168.4.1"

# The plate solver. Leave this out to use astap_cli with its database in
# /opt/astap on Linux, or astap_cli.exe from PATH or C:/Program Files/astap on
# Windows, with the database beside it. Write Windows paths with forward
# slashes: in double quotes a backslash starts an escape.
# [solver]
# program = "C:/Program Files/astap/astap_cli.exe"
# database = "C:/Program Files/astap"

# The webcam that photographs the telescope, on Windows only: its name as
# listed by   ffmpeg -list_devices true -f dshow -i dummy
# Linux finds one by itself. With none named, slews are not photographed.
# [webcam]
# device = "USB2.0 PC CAMERA"

# The motor focuser (docs/focuser.md). travel: the furthest, in half-steps
# either way, a focus run may turn it from where it started.
[focuser]
travel = 512

[filterwheel]
# The Starlight Xpress USB wheel's filters, position 1 first, a gap left empty
# (sxwheel.py). Blank: the positions go by number. Fill it in only after
# looking: ./sxwheel.py move 1, see which filter is in the light path, and so
# on round. Seven filters in seven slots would be, in the order found:
#   filters = "L,R,G,B,Ha,SII,OIII"
filters = ""
# Each filter's maker, in the same order, for naming the band a magnitude is
# in ("L (Optolong), 183M"); blank where unknown:
#   makers = "Optolong,Optolong,Optolong,Optolong,,,"
makers = ""
# A filter's focus offset from L is used only when at least three
# measurements on different nights spread by no more than this (half-steps;
# provisional until the focuser's steps per mm are measured). After a change,
# a first frame this many times wider than the last run in L means refocus.
offset_tolerance = 16
# The parfocal sets, filters that focus together (Gary, 4 November 2026):
# no offset within a set, one from L's set to each other. A filter the
# proving night (./focus.py --walk-in --prove-sets) finds outside its set
# gets its own offset.
sets = "L,R,G,B;SII,Ha,OIII"
size_tolerance = 1.25

[indi]
port = 7624
# true: start and restart the INDI server for the camera automatically. That
# stops any INDI server already running, so leave it false if other equipment
# shares one, and start "indiserver <driver>" yourself.
manage_server = false

# Telling the house when cloud or rain arrives (./alert.py, docs/alerts.md):
# a Hue light by its name on the bridge, and a Google Home or Chromecast
# speaker by its name. Either may be left out.
# [alerts]
# light = "Living room lamp"
# speaker = "Kitchen speaker"

# Alerts to your phone by your own Telegram bot (notify.py): the token
# @BotFather gives, and your chat's number. The patrol's unexplained
# candidates are sent here. Keep this file
# private: the token lets anyone send as the bot.
# [telegram]
# token = "123456:ABC..."
# chat = "123456789"

# How a night's plan chooses and runs its steps (docs/observing-plan-spec.md).
# Each phase is switched on here and can be switched off again; off, the
# plan runs as before. goals: a capture keeps going until its desired
# accepted frames or its cap (Phase 2). windows: protected steps keep their
# start, and flexible steps are timed back from it (Phase 3). dispatch: the
# next of tonight's agreed steps is chosen at each step's end (Phase 4).
# follow_up_share: the share of a night uncertain candidates' follow-ups may take.
[plan]
goals = false
windows = false
dispatch = false
follow_up_share = 0.25

[storage]
# A folder on a bigger disk where finished Moon videos are moved, leaving a
# link behind, when the data disk runs low (./storage.py). Empty: never moved.
archive = ""
