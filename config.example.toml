# Copy this file to config.toml and fill in your own site.
# config.toml is not committed, since it gives away where you live.

[site]
name = "My back garden"
# Decimal degrees; west longitudes are negative. A postcode's centre is
# accurate enough.
latitude = 51.4779
longitude = -0.0015
elevation_m = 45
timezone = "Europe/London"
# Zenith sky brightness in mag/arcsec². Leave unset to look it up in the
# light pollution atlas; set it if you measure the real value with a meter.
# sqm = 20.55

[horizon]
# Lowest altitude (degrees) worth pointing at in any direction.
min_altitude = 20
# Directions blocked by houses, trees etc. Azimuth runs 0 = north, 90 = east,
# 180 = south, 270 = west. Example: the house blocks the south up to 40°:
#   blocked = [ { from = 150, to = 210, altitude = 40 } ]
blocked = []

[scope]
aperture_mm = 150
focal_length_mm = 750

[camera]
# INDI driver for the camera, and the sensor's details. The plate solver
# works out the field of view from these and the focal length above.
driver = "indi_altair_ccd"
bit_depth = 12
pixel_size_um = 2.4
width = 5440
height = 3648
# A name for how the camera currently sits on the telescope. Flat frames are
# filed under it, because a flat only suits the arrangement it was taken
# with: change the name (and take new flats) whenever you rotate the camera,
# take it off and put it back, or change anything in the light path.
setup = "default"

[mount]
# Part of the name of the USB adapter on the handset's serial lead, as it
# appears under /dev/serial/by-id/.
serial_match = "FTDI"

[indi]
port = 7624
# true: start and restart the INDI server for the camera automatically. That
# stops any INDI server already running, so leave it false if other equipment
# shares one, and start "indiserver <driver>" yourself.
manage_server = false
