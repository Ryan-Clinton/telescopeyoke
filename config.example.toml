# Copy this file to config.toml and fill in your own site.
# config.toml is not committed, since it gives away where you live.

[site]
name = "My back garden"
# Decimal degrees; west longitudes are negative. A postcode's centre is
# accurate enough.
latitude = 51.4779
longitude = -0.0015
elevation_m = 45
timezone = "Europe/London"
# Zenith sky brightness in mag/arcsec². Leave unset to look it up in the
# light pollution atlas; set it if you measure the real value with a meter.
# sqm = 20.55

[horizon]
# Lowest altitude (degrees) worth pointing at in any direction.
min_altitude = 20
# Directions blocked by houses, trees etc. Azimuth runs 0 = north, 90 = east,
# 180 = south, 270 = west. Example: the house blocks the south up to 40°:
#   blocked = [ { from = 150, to = 210, altitude = 40 } ]
blocked = []
# A skyline measured from where the telescope stands (./panorama.py from a
# phone panorama, or ./horizon.py --trace) is used as well, raised by this
# many degrees: one branch is enough to spoil a frame.
margin = 2
# false: leave the measured skyline out and go by `blocked` alone.
use_survey = true

[scope]
aperture_mm = 150
focal_length_mm = 750

[camera]
# INDI driver for the camera, and the sensor's details. The plate solver
# works out the field of view from these and the focal length above.
driver = "indi_altair_ccd"
bit_depth = 12
pixel_size_um = 2.4
width = 5440
height = 3648
# A name for how the camera currently sits on the telescope. Flat frames are
# filed under it, because a flat only suits the arrangement it was taken
# with: change the name (and take new flats) whenever you rotate the camera,
# take it off and put it back, or change anything in the light path.
setup = "default"
# How frames are fetched from the camera. "indi" is the INDI driver above
# and the default on Linux. "altair" is Altair's own library, with its files
# in vendor/altair/; it is the default on Windows, where INDI does not run.
# backend = "altair"
# With the "altair" backend only:
# serial = "..."          which camera to use when more than one is plugged in
# readout_speed = 1       the camera's readout speed level; unset leaves it as it is

[mount]
# Part of the name of the USB adapter on the handset's serial lead, as it
# appears under /dev/serial/by-id/, or on Windows against the COM port in
# Device Manager. A handset plugged in by its own USB socket is "Prolific".
serial_match = "FTDI"
# How the mount is reached. "handset": a serial lead to the SynScan handset,
# which is the tested way. With no handset plugged in: "wifi" for the SynScan
# Wi-Fi adapter, or "eqdir" for an EQDIR lead (found by serial_match). On
# these two the mount must be told where home is (./mount.py sethome) and,
# once, which way its Dec motor turns (./mount.py directions).
# link = "wifi"
# The Wi-Fi adapter's address. Leave it out to find the adapter by asking the
# network; it is 192.168.4.1 on the network the adapter makes itself.
# address = "192.168.4.1"

# The plate solver. Leave this out to use astap_cli with its database in
# /opt/astap on Linux, or astap_cli.exe from PATH or C:/Program Files/astap on
# Windows, with the database beside it. Write Windows paths with forward
# slashes: in double quotes a backslash starts an escape.
# [solver]
# program = "C:/Program Files/astap/astap_cli.exe"
# database = "C:/Program Files/astap"

# The webcam that photographs the telescope, on Windows only: its name as
# listed by   ffmpeg -list_devices true -f dshow -i dummy
# Linux finds one by itself. With none named, slews are not photographed.
# [webcam]
# device = "USB2.0 PC CAMERA"

[indi]
port = 7624
# true: start and restart the INDI server for the camera automatically. That
# stops any INDI server already running, so leave it false if other equipment
# shares one, and start "indiserver <driver>" yourself.
manage_server = false
